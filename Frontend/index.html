
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartBuild — Resource Planning System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0F172A;--blue:#2563EB;--blue2:#3B82F6;--bg:#F1F5F9;--card:#FFFFFF;
  --green:#16A34A;--amber:#D97706;--red:#DC2626;--muted:#64748B;--border:#E2E8F0;
  --purple:#7C3AED;--orange:#EA580C;--shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow-hover:0 4px 12px rgba(0,0,0,.12);--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy);background:var(--bg)}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
.app{min-height:100vh}
.login-screen{min-height:100vh;display:grid;grid-template-columns:48% 52%;background:#fff}
.login-hero{position:relative;overflow:hidden;padding:64px;display:flex;align-items:center;background:
  radial-gradient(circle at 18% 18%,rgba(37,99,235,.32),transparent 32%),
  radial-gradient(circle at 82% 76%,rgba(59,130,246,.18),transparent 35%),
  linear-gradient(135deg,#0F172A,#1E3A5F)}
.login-hero:before{content:"";position:absolute;inset:0;background:
  linear-gradient(140deg,transparent 42%,rgba(255,255,255,.05) 42%,rgba(255,255,255,.05) 43%,transparent 43%),
  linear-gradient(30deg,transparent 55%,rgba(255,255,255,.04) 55%,rgba(255,255,255,.04) 56%,transparent 56%);
  opacity:.7}
.hero-grid{position:absolute;inset:auto -60px -100px auto;width:420px;height:420px;border:1px solid rgba(255,255,255,.08);transform:rotate(18deg);box-shadow:0 0 0 80px rgba(255,255,255,.02),0 0 0 160px rgba(255,255,255,.02)}
.hero-content{position:relative;z-index:1;max-width:630px;color:white}
.brand-lockup{font-size:38px;font-weight:800;letter-spacing:-1.5px;margin-bottom:8px}
.hero-sub{font-size:18px;color:#CBD5E1;margin-bottom:38px}
.hero-tag{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);border-radius:999px;font-size:12px;font-weight:700;margin-bottom:24px}
.feature-list{display:grid;gap:14px;margin-top:30px}
.feature-item{display:flex;align-items:center;gap:14px;color:#E2E8F0;font-size:15px}
.feature-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08)}
.login-side{display:flex;align-items:center;justify-content:center;padding:38px;background:#fff}
.login-box{width:min(500px,100%)}
.login-box h1{font-size:34px;letter-spacing:-1.2px;margin:0 0 8px}
.login-box .subtitle{color:var(--muted);margin:0 0 26px}
.role-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;background:#F8FAFC;border:1px solid var(--border);border-radius:10px;margin-bottom:22px}
.role-switch button{border:0;background:transparent;padding:11px;border-radius:8px;font-weight:700;color:var(--muted)}
.role-switch button.active{background:var(--blue);color:#fff;box-shadow:0 2px 5px rgba(37,99,235,.22)}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
.input-wrap{position:relative}
.input,.select{width:100%;height:44px;border:1px solid var(--border);background:#fff;border-radius:9px;padding:0 13px;outline:none;transition:.2s var(--ease)}
.input:focus,.select:focus{border-color:#93C5FD;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.password-toggle{position:absolute;right:5px;top:5px;height:34px;padding:0 9px;border:0;background:#F8FAFC;border-radius:7px;color:var(--muted)}
.login-options{display:flex;align-items:center;justify-content:space-between;margin:10px 0 20px;font-size:13px}
.checkbox{display:flex;align-items:center;gap:7px;color:var(--muted)}
.checkbox input{accent-color:var(--blue)}
.link{color:var(--blue);font-weight:700;text-decoration:none}
.primary-btn,.secondary-btn,.danger-btn{border:0;border-radius:8px;padding:11px 15px;font-weight:800;transition:.2s var(--ease)}
.primary-btn{background:var(--blue);color:#fff;box-shadow:0 3px 8px rgba(37,99,235,.18)}
.secondary-btn{background:#fff;border:1px solid var(--border);color:var(--navy)}
.danger-btn{background:#FEF2F2;color:var(--red);border:1px solid #FECACA}
.primary-btn:hover,.secondary-btn:hover,.danger-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-hover)}
.full{width:100%}
.demo-box{margin-top:24px;border:1px solid var(--border);border-radius:12px;padding:15px;background:#F8FAFC}
.demo-box h4{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.demo-row{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center;font-size:12px;padding:8px 0;border-top:1px dashed var(--border)}
.demo-row:first-of-type{border-top:0}
.cred-role{font-weight:800}
.demo-fill{border:0;background:#fff;text-align:left;color:var(--blue);padding:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login-error{min-height:18px;color:var(--red);font-size:12px;font-weight:600;margin-top:9px}

.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--navy);color:#CBD5E1;padding:18px 12px;display:flex;flex-direction:column;z-index:30}
.logo{color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px;padding:8px 10px 20px}
.logo small{color:#94A3B8;font-size:10px;font-weight:600;display:block}
.sidebar-nav{display:grid;gap:4px}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#64748B;font-weight:800;padding:13px 11px 7px}
.nav-btn{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#CBD5E1;padding:10px 11px;border-radius:9px;text-align:left;font-weight:700;font-size:13px;transition:.2s var(--ease)}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn.active{background:var(--blue);color:#fff}
.nav-icon{width:19px;text-align:center}
.sidebar-bottom{margin-top:auto;display:grid;gap:5px}
.content{grid-column:2;min-width:0}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20}
.top-left .page-title{font-size:18px;font-weight:800;letter-spacing:-.3px}
.breadcrumb{font-size:11px;color:var(--muted);margin-top:3px}
.top-right{display:flex;align-items:center;gap:14px}
.date-chip{font-size:12px;color:var(--muted);padding-right:10px;border-right:1px solid var(--border)}
.notif-wrap{position:relative}
.icon-btn{width:36px;height:36px;border:1px solid var(--border);background:#fff;border-radius:9px;display:grid;place-items:center;position:relative}
.badge-count{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center;background:var(--red);color:#fff;border-radius:999px;font-size:9px;font-weight:800;border:2px solid #fff}
.user-pill{display:flex;align-items:center;gap:9px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2563EB,#1D4ED8);color:#fff;display:grid;place-items:center;font-weight:800}
.user-meta{line-height:1.15}
.user-meta strong{display:block;font-size:12px}
.user-meta span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.notif-menu{position:absolute;right:0;top:44px;width:320px;background:#fff;border:1px solid var(--border);box-shadow:0 16px 40px rgba(15,23,42,.14);border-radius:12px;padding:10px;z-index:50}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:5px 6px 9px;font-size:12px;font-weight:800}
.alert-item{padding:10px;border-radius:9px;background:#F8FAFC;margin-top:6px;border-left:4px solid var(--amber)}
.alert-item.red{border-left-color:var(--red)} .alert-item.blue{border-left-color:var(--blue)} .alert-item.green{border-left-color:var(--green)}
.alert-item strong{font-size:12px;display:block}.alert-item span{font-size:11px;color:var(--muted);display:block;margin-top:3px}

main{padding:24px 26px 36px}
.view{display:none;animation:fadeSlide .32s var(--ease)}
.view.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-head h2{font-size:22px;letter-spacing:-.7px;margin:0 0 4px}
.page-head p{font-size:12px;color:var(--muted);margin:0}
.actions{display:flex;gap:8px;align-items:center}
.grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:1.65fr 1fr .75fr;gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:12px;padding:16px}
.card:hover{box-shadow:var(--shadow-hover)}
.stat-card{min-height:118px;position:relative;overflow:hidden}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#EFF6FF;color:var(--blue)}
.stat-label{font-size:11px;color:var(--muted);font-weight:700}
.stat-value{font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:12px}
.stat-sub{font-size:10px;color:var(--muted);margin-top:4px}
.trend{position:absolute;right:12px;bottom:13px;font-size:10px;font-weight:800;padding:4px 6px;border-radius:999px}
.trend.up{color:var(--green);background:#F0FDF4}.trend.warn{color:var(--amber);background:#FFFBEB}.trend.down{color:var(--red);background:#FEF2F2}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.section-title h3{font-size:13px;margin:0}.section-title a{font-size:11px;color:var(--blue);font-weight:800;text-decoration:none}
.chart-box{height:260px}.chart-box.small{height:245px}.chart-center{height:235px;position:relative;display:grid;place-items:center}.chart-center .center-label{position:absolute;text-align:center;pointer-events:none}.chart-center strong{font-size:17px;display:block}.chart-center span{font-size:10px;color:var(--muted)}
.alert-stack{display:grid;gap:9px}
.resource-alert{padding:10px 11px;background:#F8FAFC;border-left:4px solid var(--amber);border-radius:8px}
.resource-alert.red{border-left-color:var(--red)} .resource-alert.orange{border-left-color:#F97316}
.resource-alert strong{font-size:11px;display:block}.resource-alert span{font-size:10px;color:var(--muted);display:block;margin-top:3px}

.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px}
.table{width:100%;border-collapse:collapse;min-width:720px}
.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:left;font-size:11px;white-space:nowrap}
.table th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#F8FAFC}
.table tbody tr:nth-child(even){background:#FBFDFF}
.table tbody tr:hover{background:#F8FAFC}
.table tr:last-child td{border-bottom:0}
.status{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800}
.status.green{color:#166534;background:#DCFCE7}.status.red{color:#991B1B;background:#FEE2E2}.status.blue{color:#1D4ED8;background:#DBEAFE}
.status.amber{color:#92400E;background:#FEF3C7}.status.orange{color:#9A3412;background:#FFEDD5}.status.gray{color:#475569;background:#E2E8F0}
.action-dot{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 5px;border-radius:6px}
.action-dot:hover{background:#E2E8F0;color:var(--navy)}
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search{min-width:240px;max-width:320px;position:relative}.search input{padding-left:34px}.search span{position:absolute;left:11px;top:13px;color:#94A3B8}
.filter-bar .select{width:auto;min-width:140px;height:40px}.filter-bar .input{height:40px}
.section-gap{margin-top:12px}
.progress{height:7px;border-radius:999px;background:#E2E8F0;overflow:hidden;min-width:85px}
.progress > span{display:block;height:100%;width:0;border-radius:999px;background:var(--blue);transition:width .8s var(--ease)}
.progress.red > span{background:var(--red)}.progress.amber > span{background:var(--amber)}.progress.green > span{background:var(--green)}
.progress-cell{display:flex;align-items:center;gap:7px}.progress-cell b{font-size:10px}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.shortage{border:1px solid #FDE68A;background:#FFFBEB;padding:14px;border-radius:12px}
.shortage h4{margin:0 0 8px;font-size:12px}.shortage-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed #FDE68A;font-size:11px}.shortage-row:first-of-type{border-top:0}.shortage-row strong{color:var(--red)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-overlay.show{display:flex}
.modal{width:min(560px,100%);background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(15,23,42,.22);animation:modalIn .25s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font-size:16px}.modal-close{border:0;background:#F8FAFC;width:32px;height:32px;border-radius:8px;color:var(--muted)}
.modal-body{padding:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full-row{grid-column:1/-1}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);background:#F8FAFC;border-radius:0 0 14px 14px}
.toast{position:fixed;right:22px;bottom:22px;background:var(--navy);color:#fff;padding:12px 15px;border-radius:10px;box-shadow:0 14px 30px rgba(15,23,42,.2);font-size:12px;z-index:150;opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s var(--ease)}.toast.show{opacity:1;transform:none}

.worker-hero{border-radius:14px;overflow:hidden;background:
  radial-gradient(circle at 72% 25%,rgba(59,130,246,.28),transparent 28%),
  linear-gradient(135deg,#0F172A,#1E3A5F);color:#fff;padding:24px;position:relative;min-height:145px;display:flex;align-items:center}
.worker-hero:after{content:"";position:absolute;right:-50px;top:-120px;width:330px;height:330px;border:1px solid rgba(255,255,255,.10);border-radius:50%;box-shadow:0 0 0 50px rgba(255,255,255,.02),0 0 0 100px rgba(255,255,255,.02)}
.worker-hero h2{margin:0;font-size:25px;letter-spacing:-.7px}.worker-hero p{margin:7px 0 0;color:#CBD5E1;font-size:12px}.hero-meta{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap}.hero-chip{padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.09);font-size:10px}
.assignment{display:grid;grid-template-columns:1fr 1fr;gap:16px}.site-visual{min-height:220px;border-radius:11px;background:
  linear-gradient(180deg,rgba(37,99,235,.06),rgba(15,23,42,.78)),
  linear-gradient(135deg,#1E3A5F 0 38%,#475569 38% 41%,#334155 41% 68%,#64748B 68% 72%,#1E293B 72%);display:flex;align-items:flex-end;padding:15px;color:#fff;position:relative;overflow:hidden}
.site-visual:before{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(180deg,transparent,#111827)}
.site-caption{position:relative;z-index:1}.site-caption small{display:block;color:#CBD5E1;font-size:9px}.site-caption strong{display:block;margin-top:4px;font-size:15px}
.detail-list{display:grid;gap:10px;align-content:center}.detail-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--border);padding-bottom:9px;font-size:11px}.detail-row:last-child{border-bottom:0}.detail-row span{color:var(--muted)}.detail-row strong{text-align:right}
.wage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.mini-stat{border:1px solid var(--border);padding:11px;border-radius:9px;background:#FBFDFF}.mini-stat small{display:block;color:var(--muted);font-size:10px}.mini-stat strong{display:block;font-size:15px;margin-top:5px}
.job-table td,.job-table th{font-size:10px}.apply-btn{border:0;background:#EFF6FF;color:var(--blue);font-weight:800;border-radius:7px;padding:6px 8px;font-size:10px}.apply-btn.applied{background:#DCFCE7;color:#166534}
.owner-kpi .stat-value{font-size:25px}

.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}
.skeleton{background:linear-gradient(90deg,#F1F5F9 25%,#E2E8F0 50%,#F1F5F9 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}
.loading-overlay{position:fixed;inset:0;background:rgba(241,245,249,.88);display:flex;align-items:center;justify-content:center;z-index:120}
.loading-card{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow-hover);padding:20px 24px;border-radius:12px;font-size:12px;font-weight:800}

@media (max-width:1180px){
  .login-screen{grid-template-columns:1fr}.login-hero{display:none}.grid-6{grid-template-columns:repeat(3,1fr)}.grid-3{grid-template-columns:1fr 1fr}.grid-3 > .card:last-child{grid-column:1/-1}
}
@media (max-width:880px){
  .shell{grid-template-columns:74px 1fr}.sidebar{width:74px}.logo{justify-content:center;padding-inline:4px;font-size:0}.logo span{font-size:21px}.logo small,.nav-btn .nav-text,.nav-section{display:none}.nav-btn{justify-content:center;padding:11px}.topbar{padding-inline:16px}.user-meta,.date-chip{display:none}.grid-6,.grid-5,.grid-4,.kpi-strip{grid-template-columns:1fr 1fr}.grid-3,.grid-2,.assignment{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}
}
@media (max-width:620px){
  main{padding:16px}.topbar{height:64px}.grid-6,.grid-5,.grid-4,.kpi-strip,.wage-grid{grid-template-columns:1fr}.top-left .page-title{font-size:16px}.notif-menu{right:-70px;width:290px}.form-grid{grid-template-columns:1fr}.form-grid .full-row{grid-column:auto}.login-side{padding:20px}.login-box h1{font-size:28px}
}

/* ===== SmartBuild Modern UI Upgrade ===== */
:root{
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --surface-3:#f1f5f9;
  --ink:#0f172a;
  --ink-2:#334155;
  --muted-2:#94a3b8;
  --blue-soft:#eff6ff;
  --blue-line:#bfdbfe;
  --green-soft:#f0fdf4;
  --amber-soft:#fffbeb;
  --red-soft:#fef2f2;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:9px;
}

body{
  background:
    radial-gradient(circle at 90% -10%, rgba(37,99,235,.055), transparent 24%),
    linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);
}

main{max-width:1600px;margin:0 auto}
.topbar{
  backdrop-filter:blur(16px);
  background:rgba(255,255,255,.88);
}
.page-head{
  margin-bottom:22px;
}
.page-head h2{
  font-size:26px;
  letter-spacing:-1px;
}
.page-head p{
  max-width:760px;
  line-height:1.55;
}

.card{
  border-radius:var(--radius-lg);
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px rgba(15,23,42,.035);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease);
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(15,23,42,.08);
  border-color:#dbe3ee;
}

.stat-card{
  min-height:132px;
  background:linear-gradient(180deg,#fff 0%,#fbfdff 100%);
}
.stat-card:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:linear-gradient(180deg,var(--blue),#60a5fa);
  opacity:.9;
}
.stat-card:nth-child(2):before{background:linear-gradient(180deg,var(--green),#4ade80)}
.stat-card:nth-child(3):before{background:linear-gradient(180deg,var(--red),#fb7185)}
.stat-card:nth-child(4):before{background:linear-gradient(180deg,#6366f1,#818cf8)}

function enterApp(role){
  state.role=role; state.notificationsOpen=false;

}
function renderShell(){
  if(!state.role){renderLogin();return}
  const role=state.role;
  app.innerHTML=`<div class="shell">${sidebarHtml(role)}<section class="content">
    ${topbarHtml(role==='engineer'?'Engineer':role==='worker'?'Ramesh Kumar':'Owner',
      role==='engineer'?'engineer@smartbuild.com':role==='worker'?'worker@smartbuild.com':'owner@smartbuild.com',
      getViewTitle())}
    <main id="mainContent">${renderCurrentView()}</main>
  </section></div>`;
  wireShell();
  animateProgress();
  requestAnimationFrame(()=>buildChartsForView());
  countStats();
  bindStatCardInteractions();
}
function getViewTitle(){
  const map={dashboard:'Dashboard',workers:'Workers',machinery:'Machinery',materials:'Materials',sites:'Sites',expenses:'Expenses',reports:'Reports',settings:'Settings',dsa:'DSA Optimization Engine',
  attendance:'My Attendance',wages:'My Wages',jobs:'Available Jobs',applications:'My Applications',profile:'Profile',notifications:'Notifications',
  overview:'Overview','worker-util':'Worker Utilization','machine-util':'Machinery Utilization','material-use':'Material Usage'};
  return map[state[state.role+'View']]||'Dashboard';
}
function wireShell(){
  document.querySelectorAll('.nav-btn[data-view]').forEach(btn=>btn.addEventListener('click',()=>{
    state[state.role+'View']=btn.dataset.view; state.notificationsOpen=false; renderShell();
  }));
  const logout=document.getElementById('logoutBtn'); if(logout) logout.addEventListener('click',()=>{renderLogin();showToast('Signed out successfully');});
  const nb=document.getElementById('notifBtn'); if(nb) nb.addEventListener('click',()=>{state.notificationsOpen=!state.notificationsOpen;renderShell();});
  document.addEventListener('click', outsideClose, {once:true});
  document.querySelectorAll('[data-open-modal]').forEach(btn=>btn.addEventListener('click',()=>openModal(btn.dataset.openModal)));
  document.querySelectorAll('.action-dot').forEach(btn=>btn.addEventListener('click',()=>showToast('Actions menu opened')));
  document.querySelectorAll('.apply-btn').forEach(btn=>btn.addEventListener('click',()=>{
    if(btn.classList.contains('applied'))return;
    btn.classList.add('applied');btn.textContent='Applied ✓';showToast('Job application submitted');
  }));
  wireTables();
}
function outsideClose(){const menu=document.querySelector('.notif-menu'); if(menu&&!menu.contains(event.target)&&event.target.id!=='notifBtn'){state.notificationsOpen=false;}}
function renderCurrentView(){

function filterTable(target,search,filter,col){
 const host=document.getElementById(target);if(!host)return;const rows=host.querySelectorAll('tbody tr');
 rows.forEach(row=>{const text=row.textContent.toLowerCase();const matchSearch=!search||text.includes(search.toLowerCase());let matchFilter=true;if(filter&&filter!=='All Sites'&&filter!=='All Status')matchFilter=(row.children[Number(col)]?.textContent||'').includes(filter);row.style.display=matchSearch&&matchFilter?'':'none';});
}
function animateProgress(){setTimeout(()=>document.querySelectorAll('[data-progress]').forEach(el=>el.style.width=el.dataset.progress+'%'),50)}
function countStats(){document.querySelectorAll('.counter').forEach(el=>{
 const target=Number(el.dataset.count);if(!Number.isFinite(target)||target===0)return;const original=el.textContent;let start=0;const dur=650;const t0=performance.now();
 const step=t=>{const p=Math.min((t-t0)/dur,1);const n=Math.round(start+(target-start)*(1-Math.pow(1-p,3)));el.textContent=target>1000?'₹'+n.toLocaleString('en-IN'):n.toLocaleString('en-IN');if(p<1)requestAnimationFrame(step);else el.textContent=original};requestAnimationFrame(step);
})}

function dsaGraphEdges() {
  return [
    ['A','B',5],['A','C',8],['A','D',3],['B','C',4],['B','E',7],
    ['C','D',6],['C','E',2],['D','E',4],['D','F',5],['E','F',3]
  ];
}
function dsaGraphAdj(){
  const adj = {A:[],B:[],C:[],D:[],E:[],F:[]};
  dsaGraphEdges().forEach(([u,v,w])=>{adj[u].push([v,w]);adj[v].push([u,w]);});
  Object.keys(adj).forEach(k=>adj[k].sort((a,b)=>a[0].localeCompare(b[0])));
  return adj;
}
function dsaGraphMatrix(){
  const nodes=['A','B','C','D','E','F'];
  const ix=Object.fromEntries(nodes.map((n,i)=>[n,i]));
  const m=nodes.map(()=>nodes.map(()=>Infinity));
  nodes.forEach((_,i)=>m[i][i]=0);
  dsaGraphEdges().forEach(([u,v,w])=>{m[ix[u]][ix[v]]=w;m[ix[v]][ix[u]]=w;});
  return {nodes,m};
}
function dsaMatrixHtml(matrix,nodes){

/* --- Tree algorithms --- */
function dsaBSTInsert(root,v){
  if(!root)return {v,left:null,right:null};
  if(v<root.v)root.left=dsaBSTInsert(root.left,v); else if(v>root.v)root.right=dsaBSTInsert(root.right,v);
  return root;
}
function dsaBSTSearch(root,v){
  let cur=root,steps=[];
  while(cur){steps.push(cur.v);if(cur.v===v)return {found:true,steps};cur= v<cur.v?cur.left:cur.right;}
  return {found:false,steps};
}
function dsaBSTIn(root,a=[]){if(!root)return a;dsaBSTIn(root.left,a);a.push(root.v);dsaBSTIn(root.right,a);return a}
function dsaBSTPre(root,a=[]){if(!root)return a;a.push(root.v);dsaBSTPre(root.left,a);dsaBSTPre(root.right,a);return a}
function dsaBSTPost(root,a=[]){if(!root)return a;dsaBSTPost(root.left,a);dsaBSTPost(root.right,a);a.push(root.v);return a}
function dsaBSTLevels(root){
  if(!root)return [];
  const out=[],q=[root];
  while(q.length){const n=q.length,row=[];for(let i=0;i<n;i++){const x=q.shift();row.push(x.v);if(x.left)q.push(x.left);if(x.right)q.push(x.right)}out.push(row)}
  return out;
}

function dsaAVLHeight(n){return n?n.h:0}
function dsaAVLNode(v){return {v,h:1,left:null,right:null}}
function dsaAVLY(n){return n?Math.max(dsaAVLHeight(n.left),dsaAVLHeight(n.right))+1:0}
function dsaAVLRight(y){const x=y.left,t=x.right;x.right=y;y.left=t;y.h=dsaAVLY(y);x.h=dsaAVLY(x);return x}
function dsaAVLLeft(x){const y=x.right,t=y.left;y.left=x;x.right=t;x.h=dsaAVLY(x);y.h=dsaAVLY(y);return y}
function dsaAVLInsert(n,v){
  if(!n)return dsaAVLNode(v);
  if(v<n.v)n.left=dsaAVLInsert(n.left,v); else if(v>n.v)n.right=dsaAVLInsert(n.right,v); else return n;
  n.h=dsaAVLY(n); const b=dsaAVLHeight(n.left)-dsaAVLHeight(n.right);
  if(b>1&&v<n.left.v)return dsaAVLRight(n);
  if(b<-1&&v>n.right.v)return dsaAVLLeft(n);
  if(b>1&&v>n.left.v){n.left=dsaAVLLeft(n.left);return dsaAVLRight(n)}
  if(b<-1&&v<n.right.v){n.right=dsaAVLRight(n.right);return dsaAVLLeft(n)}
  return n;
}

  return {
    title:'AVL Resource Index',

}

/* --- Graph algorithms --- */
function dsaBFS(start='A'){
  const adj=dsaGraphAdj(),q=[start],seen=new Set([start]),order=[];
  while(q.length){const u=q.shift();order.push(u);for(const [v] of adj[u])if(!seen.has(v)){seen.add(v);q.push(v)}}
  return order;
}
function dsaDFS(start='A'){
  const adj=dsaGraphAdj(),seen=new Set(),order=[];
  function go(u){seen.add(u);order.push(u);for(const [v] of adj[u])if(!seen.has(v))go(v)}
  go(start);return order;
}
function dsaComponents(){
  const adj=dsaGraphAdj(),seen=new Set(),out=[];
  Object.keys(adj).forEach(s=>{if(seen.has(s))return;const comp=[];const q=[s];seen.add(s);while(q.length){const u=q.shift();comp.push(u);for(const [v] of adj[u])if(!seen.has(v)){seen.add(v);q.push(v)}}out.push(comp)});
  return out;
}
function dsaPrim(){
  const adj=dsaGraphAdj(),used=new Set(['A']),edges=[],steps=[];
  while(used.size<Object.keys(adj).length){
    let best=null;
    for(const u of used)for(const [v,w] of adj[u])if(!used.has(v)&&(!best||w<best[2]))best=[u,v,w];
    if(!best)break;used.add(best[1]);edges.push(best);steps.push(`${best[0]} → ${best[1]} (${best[2]})`);
  }
  return {edges,cost:edges.reduce((s,e)=>s+e[2],0),steps};
}
function dsaKruskal(){
  const edges=dsaGraphEdges().slice().sort((a,b)=>a[2]-b[2]);const parent={A:'A',B:'B',C:'C',D:'D',E:'E',F:'F'};
  const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));const out=[];
  for(const e of edges){const a=find(e[0]),b=find(e[1]);if(a!==b){parent[a]=b;out.push(e)}}
  return {edges:out,cost:out.reduce((s,e)=>s+e[2],0)};
}
function dsaDijkstra(start='A'){
  const adj=dsaGraphAdj(),dist=Object.fromEntries(Object.keys(adj).map(x=>[x,Infinity])),prev={};dist[start]=0;
  const un=new Set(Object.keys(adj));
  while(un.size){let u=[...un].reduce((best,x)=>dist[x]<dist[best]?x:best);un.delete(u);for(const [v,w] of adj[u]){const nd=dist[u]+w;if(nd<dist[v]){dist[v]=nd;prev[v]=u}}}
  const target='F',path=[];let cur=target;while(cur){path.unshift(cur);if(cur===start)break;cur=prev[cur]}
  return {dist,path};
}
function dsaBellmanFord(){
  const nodes=['A','B','C','D','E','F'],edges=dsaGraphEdges();const dist=Object.fromEntries(nodes.map(n=>[n,Infinity]));dist.A=0;
  for(let i=0;i<nodes.length-1;i++)for(const [u,v,w] of edges){if(dist[u]+w<dist[v])dist[v]=dist[u]+w;if(dist[v]+w<dist[u])dist[u]=dist[v]+w}
  return dist;
}
function dsaFloyd(){
  const {nodes,m}=dsaGraphMatrix();const d=m.map(r=>r.slice());
  for(let k=0;k<nodes.length;k++)for(let i=0;i<nodes.length;i++)for(let j=0;j<nodes.length;j++)d[i][j]=Math.min(d[i][j],d[i][k]+d[k][j]);
  return {nodes,m:d};
}
function dsaClosure(){
  const {nodes,m}=dsaGraphMatrix();const reach=m.map(row=>row.map(v=>v!==Infinity?1:0));
  for(let k=0;k<nodes.length;k++)for(let i=0;i<nodes.length;i++)for(let j=0;j<nodes.length;j++)reach[i][j]=reach[i][j]||(reach[i][k]&&reach[k][j]);
  return {nodes,m:reach};
}

/* --- Dynamic Programming --- */
function dsaKnapsack(){
  const items=[
    ['Generator',30000,80],['Concrete Mixer',25000,70],['Pump',20000,60],['Safety Kit',10000,35],['JCB Attachment',40000,85]
  ];const B=60000;
  const dp=Array.from({length:items.length+1},()=>Array(B+1).fill(0));
  for(let i=1;i<=items.length;i++){const [,c,v]=items[i-1];for(let b=0;b<=B;b++)dp[i][b]=c<=b?Math.max(dp[i-1][b],dp[i-1][b-c]+v):dp[i-1][b]}
  let b=B,chosen=[];for(let i=items.length;i>0;i--){if(dp[i][b]!==dp[i-1][b]){chosen.push(items[i-1]);b-=items[i-1][1]}}
  chosen.reverse();
  return {title:'0/1 Knapsack',viz:`<div class="result-list">${chosen.map(x=>`<div class="result-chip"><strong>${x[0]}</strong><span>₹${x[1].toLocaleString('en-IN')} · value ${x[2]}</span></div>`).join('')}</div>`,
    summary:[['Budget','₹60,000'],['Selected',chosen.length],['Best value',dp[items.length][B]],['Unused budget','₹'+b.toLocaleString('en-IN')]],
    code:`Budget = 60000\nSelected:\n${chosen.map(x=>x[0]).join('\n')}\nOptimal value = ${dp[items.length][B]}`,
    integration:'Select the best set of machines/safety resources without exceeding the site budget.'};
}
function dsaLCS(){
  const a=['Foundation','Steel','Concrete','Columns','Roof'],b=['Foundation','Steel','Concrete','Beams','Roof'];
  const m=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=a[i-1]===b[j-1]?m[i-1][j-1]+1:Math.max(m[i-1][j],m[i][j-1]);
  let i=a.length,j=b.length,out=[];while(i&&j){if(a[i-1]===b[j-1]){out.unshift(a[i-1]);i--;j--}else if(m[i-1][j]>=m[i][j-1])i--;else j--}
  return {title:'Longest Common Subsequence',viz:`<div class="result-list"><div class="result-chip"><strong>Plan A</strong><span>${a.join(' → ')}</span></div><div class="result-chip"><strong>Plan B</strong><span>${b.join(' → ')}</span></div><div class="result-chip"><strong>LCS</strong><span>${out.join(' → ')}</span></div></div>`,
    summary:[['Plan A tasks',a.length],['Plan B tasks',b.length],['Common sequence',out.length],['Similarity','80%']],
    code:`LCS:\n${out.join(' -> ')}`,integration:'Compare revised construction plans and identify shared task sequences.'};
}
function dsaMCM(){
  const dims=[10,20,30,40,30],n=dims.length-1;const dp=Array.from({length:n},()=>Array(n).fill(0));
  for(let len=2;len<=n;len++)for(let i=0;i<=n-len;i++){let j=i+len-1;dp[i][j]=Infinity;for(let k=i;k<j;k++)dp[i][j]=Math.min(dp[i][j],dp[i][k]+dp[k+1][j]+dims[i]*dims[k+1]*dims[j+1]);}
  return {title:'Matrix Chain Multiplication',viz:`<div class="result-list">${dims.slice(0,-1).map((_,i)=>`<div class="result-chip"><strong>Matrix ${String.fromCharCode(65+i)}</strong><span>${dims[i]} × ${dims[i+1]}</span></div>`).join('')}</div><div class="dsa-hint">Minimum scalar multiplications: <b>${dp[0][n-1].toLocaleString()}</b></div>`,
    summary:[['Matrices',n],['Optimized cost',dp[0][n-1].toLocaleString()],['Method','Dynamic Programming'],['Use','Analytics pipeline optimization']],
    code:`Dimensions: ${dims.join(' × ')}\nOptimal cost = ${dp[0][n-1]}`,integration:'Optimize the order of matrix-heavy analytics operations in resource reporting.'};
}

  const sites=['Site A','Site B','Site C','Site D'],need=[14,10,12,6],capacity=42;

/* --- Backtracking / Branch & Bound --- */
function dsaNQueen(n=6){
  const board=Array.from({length:n},()=>Array(n).fill('.')),cols=new Set(),d1=new Set(),d2=new Set();
  function solve(r){if(r===n)return true;for(let c=0;c<n;c++){if(cols.has(c)||d1.has(r-c)||d2.has(r+c))continue;board[r][c]='Q';cols.add(c);d1.add(r-c);d2.add(r+c);if(solve(r+1))return true;board[r][c]='.';cols.delete(c);d1.delete(r-c);d2.delete(r+c)}return false}
  solve(0);
  return {title:'N-Queen Safety Placement',viz:`<div style="display:grid;grid-template-columns:repeat(${n},38px);justify-content:center;border:1px solid #e2e8f0;width:max-content;margin:auto">${board.flatMap(row=>row.map(x=>`<div style="width:38px;height:38px;display:grid;place-items:center;border:1px solid #e2e8f0;background:${x==='Q'?'#dbeafe':'#fff'};font-weight:900;color:#1d4ed8">${x}</div>`)).join('')}</div>`,
    summary:[['Grid',`${n} × ${n}`],['Queens',n],['Conflicts','0'],['Method','Backtracking']],
    code:`Valid ${n}-Queen configuration generated.\nEach row/column/diagonal has at most one queen.`,integration:'Model non-conflicting placement constraints for safety zones or equipment positions.'};
}
function dsaColoring(){
  const graph={A:['B','C'],B:['A','C','D'],C:['A','B','D'],D:['B','C']},colors={},palette=['Morning','Afternoon','Night'];

function dsaHamiltonian(){
  const adj={A:['B','C'],B:['A','C','D'],C:['A','B','D','E'],D:['B','C','E'],E:['C','D']},start='A',path=[start],used=new Set([start]);
  function backtrack(){if(path.length===Object.keys(adj).length)return adj[path[path.length-1]].includes(start);const u=path[path.length-1];for(const v of adj[u])if(!used.has(v)){used.add(v);path.push(v);if(backtrack())return true;path.pop();used.delete(v)}return false}
  backtrack();path.push(start);
  return {title:'Hamiltonian Cycle',viz:`<div class="result-chip"><strong>Inspection cycle</strong><span>${path.join(' → ')}</span></div>`,
    summary:[['Sites',Object.keys(adj).length],['Every site once','Yes'],['Return to start','Yes'],['Use','Inspection route']],
    code:`Hamiltonian cycle:\n${path.join(' -> ')}`,integration:'Find a route that visits every selected site exactly once and returns to the start.'};
}
function dsaSubsetSum(){
  const vals=[10000,15000,20000,25000,30000],target=50000,ans=[]; 
  function go(i,sum){if(sum===target)return true;if(sum>target||i===vals.length)return false;ans.push(vals[i]);if(go(i+1,sum+vals[i]))return true;ans.pop();return go(i+1,sum)}
  go(0,0);
  return {title:'Sum of Subsets',viz:`<div class="result-chip"><strong>Target budget</strong><span>₹50,000</span></div><div class="dsa-hint">Selected: <b>${ans.map(x=>'₹'+x.toLocaleString('en-IN')).join(' + ')}</b></div>`,
    summary:[['Target','₹50,000'],['Selected items',ans.length],['Exact match','Yes ✓'],['Method','Backtracking']],
    code:`Target = 50000\nSubset = ${ans.join(' + ')}\nSum = ${ans.reduce((s,x)=>s+x,0)}`,integration:'Find an exact combination of planned expenses/material packages inside a target budget.'};
}
function dsaTSP(){
  const nodes=['A','B','C','D'],dist={A:{A:0,B:5,C:8,D:3},B:{A:5,B:0,C:4,D:8},C:{A:8,B:4,C:0,D:6},D:{A:3,B:8,C:6,D:0}};
  let best={cost:Infinity,path:null};
  function perm(arr,l){if(l===arr.length){const p=['A',...arr,'A'];let c=0;for(let i=0;i<p.length-1;i++)c+=dist[p[i]][p[i+1]];if(c<best.cost)best={cost:c,path:p};return}for(let i=l;i<arr.length;i++){[arr[l],arr[i]]=[arr[i],arr[l]];perm(arr,l+1);[arr[l],arr[i]]=[arr[i],arr[l]]}}
  perm(['B','C','D'],0);
  return {title:'TSP Site Inspection',viz:`<div class="result-chip"><strong>Best inspection tour</strong><span>${best.path.join(' → ')}</span></div><div class="dsa-hint">Minimum tour distance: <b>${best.cost} km</b></div>`,
    summary:[['Sites',4],['Best tour',best.path.join(' → ')],['Minimum distance',best.cost+' km'],['Method','Branch & Bound model']],
    code:`Best tour = ${best.path.join(' -> ')}\nCost = ${best.cost}`,integration:'Optimize one-day engineer inspection routes across construction sites.'};
}

/* --- Heaps --- */
function dsaMinHeap(items){
  const heap=[];
  const up=i=>{while(i){const p=Math.floor((i-1)/2);if(heap[p]<=heap[i])break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p}};
  const down=i=>{for(;;){let l=i*2+1,r=l+1,s=i;if(l<heap.length&&heap[l]<heap[s])s=l;if(r<heap.length&&heap[r]<heap[s])s=r;if(s===i)break;[heap[s],heap[i]]=[heap[i],heap[s]];i=s}};
  items.forEach(v=>{heap.push(v);up(heap.length-1)});
  const pop=()=>{const out=heap[0];const last=heap.pop();if(heap.length){heap[0]=last;down(0)}return out};
  return {heap,pop};
}
function runPriorityHeap(){
  const tasks=[1,4,2,7,3,5],h=dsaMinHeap(tasks),order=[];while(h.heap.length)order.push(h.pop());
  return {title:'Priority Queue / Binary Heap',viz:`<div class="result-list">${order.map((x,i)=>`<div class="result-chip"><strong>Queue position ${i+1}</strong><span>Priority ${x}</span></div>`).join('')}</div>`,
    summary:[['Tasks',tasks.length],['Next urgent task','Priority 1'],['Extraction',order.join(' → ')],['Use','Urgent work queue']],
    code:`Min-heap extraction order:\n${order.join(' -> ')}`,integration:'Prioritize urgent site failures, shortages, safety issues, and delayed tasks.'};
}

    summary:[['Input queues',2],['Merged priorities',6],['Operation','Union'],['Use','Cross-site task merging']],
    code:`Union of binomial heap roots combines equal-rank trees.\nResult priorities: 1,2,3,4,7,8`,integration:'Merge priority queues coming from different construction sites into one global queue.'};
}

    summary:[['Operation','Decrease-Key'],['New minimum','1'],['Amortized decrease-key','O(1)'],['Use','Dynamic shortest-path queue']],
    code:`Priority 7 updated to 1.\nFibonacci heaps support very cheap amortized decrease-key.`,integration:'Use with advanced shortest-path experimentation where priorities change frequently.'};
}
